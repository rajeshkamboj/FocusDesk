[package]
name = "focusdesk-focus-widget"
version = "0.1.0"
description = "Small always-on-top Windows companion that mirrors the task FocusDesk is timing"
authors = ["FocusDesk"]
edition = "2021"
# Tauri 2 requires at least this Rust version.
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` adds the notification-area icon (Show / Quit).
tauri = { version = "2", features = ["tray-icon"] }
# Remembers where the user put the widget (position + size only).
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The loopback bridge. A blocking, tiny, dependency-light HTTP server.
tiny_http = "0.12"
# Parsing the RFC-3339 timestamps the PWA sends (the timer's source of truth).
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
