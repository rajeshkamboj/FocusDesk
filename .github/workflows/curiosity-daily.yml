name: Curiosity daily publish

# A portable second option for the scheduler: a GitHub Actions cron that calls the
# deployed app's refresh endpoint. Same 00:00 Asia/Kolkata minute as vercel.json
# (18:30 UTC; India has no daylight saving, so it never shifts).
#
# What it needs, in Settings → Secrets and variables → Actions:
#   FOCUSDESK_URL           e.g. https://focusdesk.example.com
#   CURIOSITY_CRON_SECRET   the same value the deployment uses
#
# What it does not need: a database credential, a service key, or access to this
# repository's deployment. It only ever issues one authenticated HTTP request, and
# the app decides what "due" means. Nothing here generates content, so a failed or
# paused workflow leaves the last published day on screen.

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to refresh'
        required: false
        default: 'all'
        type: choice
        options: [all, daily, book]
      force:
        description: 'Publish even if today already exists'
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Curiosity refresh
        env:
          URL: ${{ secrets.FOCUSDESK_URL }}
          SECRET: ${{ secrets.CURIOSITY_CRON_SECRET }}
          SCOPE: ${{ inputs.scope || 'all' }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "FOCUSDESK_URL and CURIOSITY_CRON_SECRET must both be set as repository secrets." >&2
            exit 1
          fi
          query="scope=${SCOPE}"
          if [ -n "${FORCE:-}" ]; then query="${query}&force=1"; fi
          # --retry covers a cold start (a scale-to-zero deployment answers on the
          # second attempt); the endpoint is idempotent per day, so a retry cannot
          # publish the same day twice.
          status=$(curl -sS -o /tmp/curiosity.json -w '%{http_code}' \
            --max-time 90 --retry 2 --retry-delay 20 \
            -X POST "${URL%/}/api/curiosity/refresh?${query}" \
            -H "authorization: Bearer ${SECRET}")
          cat /tmp/curiosity.json
          echo
          case "$status" in
            200) echo "Curiosity refresh accepted." ;;
            *)   echo "Curiosity refresh failed with HTTP $status." >&2; exit 1 ;;
          esac
